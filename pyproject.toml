[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpcarch"
version = "0.1.0"
description = "Tools for the verified reverse engineering of Amstrad CPC games: disk images, loader runner, CPC emulation around SkoolKit's Z80 core, disassembly, screen and AY rendering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["skoolkit==10.2", "numpy", "Pillow", "scipy"]

[tool.setuptools]
packages = ["cpcarch"]
